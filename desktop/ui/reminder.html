<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spatial Reminder</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; color: #f3f5fa; font: 13px/1.35 system-ui, sans-serif; }
  body { padding: 8px; }
  .card { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid #444958; border-radius: 14px;
    background: #20232b; box-shadow: 0 5px 22px #0007; overflow-y: auto; }
  h1 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #9aa3b8; }
  .item { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; border-top: 1px solid #333846; }
  .item:first-of-type { border-top: 0; padding-top: 0; }
  .text { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .row { display: flex; gap: 6px; }
  button { border: 0; border-radius: 8px; padding: 5px 10px; background: #38445c; color: #fff; font: inherit; cursor: pointer; }
  button.primary { background: #2f6feb; }
</style>
</head>
<body>
<div class="card"><h1>Spatial reminder</h1><div id="list"></div></div>
<script src="shared.js"></script>
<script src="reminder.js"></script>
</body>
</html>
