<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spatial Dictation</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; color: #f3f5fa; font: 13px/1.3 system-ui, sans-serif; }
  body { display: flex; align-items: center; padding: 8px 12px; }
  .pill { width: 100%; min-height: 54px; display: flex; align-items: center; gap: 9px; padding: 9px 12px;
    border: 1px solid #444958; border-radius: 28px; background: #20232b; box-shadow: 0 5px 22px #0007; }
  #status { flex: 1; }
  button { border: 0; border-radius: 18px; padding: 6px 10px; background: #38445c; color: white; font: inherit; cursor: pointer; }
  #cancel { background: #4a3033; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #fa5454; box-shadow: 0 0 10px #fa5454; }
</style>
</head>
<body>
<div class="pill"><span class="dot"></span><span id="status">Ready to dictate</span><button id="stop">Stop</button><button id="cancel">Cancel</button></div>
<script src="shared.js"></script>
<script src="dictation.js"></script>
</body>
</html>
