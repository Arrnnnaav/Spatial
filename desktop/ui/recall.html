<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spatial Recall</title>
<style>
  :root { --bg:#17181d; --fg:#ececf1; --muted:#9a9aab; --line:#2b2d36; --accent:#2f6feb; --chip:#22314f; }
  @media (prefers-color-scheme: light) { :root { --bg:#fff; --fg:#17171c; --muted:#6b6b7b; --line:#e6e6ee; --chip:#eaf1fe; } }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  body { display:flex; flex-direction:column; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  #q { margin:10px; padding:9px 11px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; }
  #q:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  #list { flex:1; overflow-y:auto; padding:0 6px; }
  .item { display:flex; gap:8px; padding:7px 9px; border-radius:8px; cursor:pointer; }
  .item[aria-selected="true"] { background:var(--chip); }
  .kind { flex:none; width:20px; text-align:center; color:var(--muted); }
  .main { min-width:0; flex:1; } .title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #preview { display:none; max-height:45%; overflow-y:auto; white-space:pre-wrap; overflow-wrap:anywhere; padding:10px 14px; border-top:1px solid var(--line); background:var(--chip); }
  body.preview #preview { display:block; }
  #hint { padding:6px 12px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
  .empty { padding:18px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<input id="q" type="text" placeholder="Search your Asks and dictations…" autocomplete="off" aria-label="Search history">
<div id="list" role="listbox"></div>
<div id="preview"></div>
<div id="hint">↑↓ choose · Enter copy · Shift+Enter copy as plain text · F3 preview · Esc close</div>
<script src="shared.js"></script>
<script src="dashboard-model.js"></script>
<script src="recall.js"></script>
</body>
</html>
