<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spatial</title>
<style>
  :root {
    --bg: #ffffff; --fg: #17171c; --muted: #6b6b7b; --line: #e6e6ee; --accent: #2f6feb; --chip: #eaf1fe;
    --chip-hover: #d8e6fd; --warn: #b4540a; --err-bg: #fdecec; --err: #9b1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181d; --fg: #ececf1; --muted: #9a9aab; --line: #2b2d36; --chip: #22314f; --chip-hover: #2c3f66;
            --warn: #f0a35e; --err-bg: #3a1c1c; --err: #ffb4b4; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; border: 1px solid var(--line); }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: move; }
  header .app { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { all: unset; cursor: pointer; padding: 2px 7px; border-radius: 6px; color: var(--muted); }
  header button:hover { background: var(--chip); color: var(--fg); }
  main { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .target { font-size: 12px; color: var(--muted); border-left: 3px solid var(--accent); padding: 2px 8px; margin-bottom: 10px;
            white-space: pre-wrap; max-height: 5.5em; overflow: hidden; }
  .turn { margin-bottom: 14px; }
  .q { font-weight: 600; margin-bottom: 4px; }
  .a { word-wrap: break-word; }
  .a div { white-space: pre-wrap; min-height: 1em; }
  .a h3, .a h4, .a h5 { margin: 8px 0 3px; line-height: 1.3; }
  .a ul, .a ol { margin: 3px 0 6px; padding-left: 22px; }
  .a sup { color: var(--accent); font-size: 11px; }
  .a code { font: 12.5px ui-monospace, Consolas, monospace; background: var(--chip); padding: 0 4px; border-radius: 4px; }
  .a sup.unsupported { color: var(--warn); }
  .meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 8px; align-items: center; }
  .meta button { all: unset; cursor: pointer; padding: 1px 6px; border-radius: 6px; background: var(--chip); color: var(--fg); }
  .meta button:hover { background: var(--chip-hover); }
  form button.icon { background: var(--chip); color: var(--fg); padding: 7px 10px; }
  form button.icon.on { background: #d93a3a; color: #fff; animation: pulse 1s infinite; }
  form button.icon.busy { opacity: .6; cursor: progress; }
  @keyframes pulse { 50% { opacity: .6; } }
  .sources { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12px; }
  .sources li { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sources li.unsupported::before { content: "⚠ "; color: var(--warn); }
  .sources a { color: var(--accent); text-decoration: underline; }
  .clarify { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .clarify button { all: unset; cursor: pointer; padding: 3px 8px; border-radius: 6px; background: var(--chip); color: var(--fg); }
  .clarify button:hover { background: var(--chip-hover); }
  .error { background: var(--err-bg); color: var(--err); padding: 6px 8px; border-radius: 6px; font-size: 13px; }
  .dictation-result { padding: 8px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .dictation-result button { margin-top: 8px; padding: 5px 10px; border: 0; border-radius: 7px; background: var(--chip); color: var(--fg); cursor: pointer; }
  form { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); align-items: flex-end; }
  input[type=text], input[type=password], input[type=url] { flex: 1; min-width: 0; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--bg); color: var(--fg); font: inherit; }
  textarea#question { flex: 1; min-width: 0; min-height: 36px; max-height: 120px; resize: vertical; padding: 7px 9px; border-radius: 8px;
          border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; line-height: 1.35; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button { padding: 7px 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  form button.secondary { background: var(--chip); color: var(--fg); padding-left: 8px; padding-right: 8px; }
  form button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header data-tauri-drag-region>
  <span class="app" id="app" data-tauri-drag-region>Spatial</span>
  <button id="close" title="Close (Esc)">✕</button>
</header>
<main id="thread"></main>
<form id="ask">
  <textarea id="question" placeholder="Ask about what you marked…" autocomplete="off" maxlength="12000" rows="1" aria-label="Ask or dictate about the marked content"></textarea>
  <button id="dictateButton" type="button" class="icon" title="Dictate into this composer">Dictate</button>
  <button id="mic" type="button" class="icon" title="Speak your question (click again to stop)">🎤</button>
  <button id="downloadDocx" type="button" class="secondary" title="Download the composer text as a Word document" disabled>.docx</button>
  <button id="send" type="submit">Ask</button>
</form>
<script src="geometry.js"></script>
<script src="shared.js"></script>
<script src="dashboard-model.js"></script>
<script src="panel.js"></script>
</body>
</html>
